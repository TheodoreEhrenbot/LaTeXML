name: Test paper 2509.15541 conversion

on:
  push:
    branches: [fix-iflimit-false-positive]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tkw1536/latexml-test-runtime:2024-5.38
      options: --entrypoint ""

    steps:
      - name: Check out patched LaTeXML
        uses: actions/checkout@v4

      - name: Check out ar5iv-bindings
        uses: actions/checkout@v4
        with:
          repository: dginev/ar5iv-bindings
          path: /opt/ar5iv-bindings

      - name: Install patched LaTeXML over system latexml
        shell: bash
        run: |
          source /usr/local/perlbrew/etc/bashrc
          cpanm --notest --installdeps .
          perl Makefile.PL
          make
          make install
          latexml --VERSION

      - name: Download arXiv 2509.15541 source
        shell: bash
        run: |
          apt-get install -y --no-install-recommends curl ca-certificates 2>/dev/null || true
          mkdir -p /tmp/paper
          curl -sL "https://arxiv.org/src/2509.15541" -o /tmp/paper/source.tar.gz
          cd /tmp/paper && tar xzf source.tar.gz
          ls /tmp/paper/

      - name: Convert paper (replicating ar5iv invocation)
        shell: bash
        run: |
          source /usr/local/perlbrew/etc/bashrc
          cd /tmp/paper
          # ar5iv uses:
          #   --path for bindings directory (so package stubs are found)
          #   --preload=ar5iv (loads the ar5iv.sty.ltxml preamble)
          #   iflimit=3599999 injected via latexml package
          latexml \
            --path=/opt/ar5iv-bindings/bindings \
            --preload=ar5iv.sty \
            --preamble='\usepackage[iflimit=3599999]{latexml}' \
            --dest=/tmp/paper-out.xml \
            main.tex 2>&1 | tee /tmp/conversion.log
          echo "latexml exit: $?"

      - name: Check result
        shell: bash
        run: |
          echo "=== Checking for iflimit fatal ==="
          if grep -q "if_limit" /tmp/conversion.log; then
            echo "FAIL: Hit iflimit — patch did not work"
            grep "if_limit" /tmp/conversion.log
            exit 1
          fi
          echo "PASS: No iflimit hit"
          echo ""
          echo "=== Last 5 lines of conversion log ==="
          tail -5 /tmp/conversion.log

      - name: Upload conversion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-log-${{ github.run_id }}
          path: /tmp/conversion.log
