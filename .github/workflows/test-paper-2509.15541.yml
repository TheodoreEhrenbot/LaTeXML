name: Test paper 2509.15541 conversion

on:
  push:
    branches: [fix-iflimit-false-positive]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tkw1536/latexml-test-runtime:2024-5.38
      options: --entrypoint ""

    steps:
      - name: Check out patched LaTeXML
        uses: actions/checkout@v4

      - name: Check out ar5iv-bindings
        uses: actions/checkout@v4
        with:
          repository: dginev/ar5iv-bindings
          path: ar5iv-bindings

      - name: Install patched LaTeXML
        shell: bash
        run: |
          source /usr/local/perlbrew/etc/bashrc
          cpanm --notest --installdeps .
          perl Makefile.PL
          make
          make install
          latexml --VERSION

      - name: Download arXiv 2509.15541 source
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends curl 2>/dev/null || true
          mkdir -p /tmp/paper
          python3 -c "import urllib.request; urllib.request.urlretrieve('https://arxiv.org/src/2509.15541', '/tmp/paper/source.tar.gz')" \
            || curl -sL "https://arxiv.org/src/2509.15541" -o /tmp/paper/source.tar.gz
          cd /tmp/paper && tar xzf source.tar.gz
          ls /tmp/paper/

      - name: Convert paper (replicating ar5iv invocation)
        shell: bash
        run: |
          source /usr/local/perlbrew/etc/bashrc
          cd /tmp/paper
          BINDINGS="$GITHUB_WORKSPACE/ar5iv-bindings/bindings"
          latexml \
            --path="$BINDINGS" \
            --preload=ar5iv.sty \
            --preamble='\usepackage[iflimit=3599999,tokenlimit=999999999]{latexml}' \
            --dest=/tmp/paper-out.xml \
            main.tex 2>&1 | tee /tmp/conversion.log
          echo "latexml exit: $?"

      - name: Check result
        if: always()
        shell: bash
        run: |
          if grep -q "if_limit" /tmp/conversion.log 2>/dev/null; then
            echo "FAIL: Hit iflimit — patch did not work"
            grep "if_limit" /tmp/conversion.log
            exit 1
          fi
          echo "PASS: No iflimit hit"
          tail -5 /tmp/conversion.log

      - name: Upload conversion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-log-${{ github.run_id }}
          path: /tmp/conversion.log
