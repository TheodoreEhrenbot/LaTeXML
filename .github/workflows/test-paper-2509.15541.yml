name: Test paper 2509.15541 conversion

on:
  push:
    branches: [fix-iflimit-false-positive]
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tkw1536/latexml-test-runtime:2024-5.38
      options: --entrypoint ""

    steps:
      - name: Check out patched LaTeXML
        uses: actions/checkout@v4

      - name: Check out ar5iv-bindings
        uses: actions/checkout@v4
        with:
          repository: dginev/ar5iv-bindings
          path: ar5iv-bindings

      - name: Install patched LaTeXML
        shell: bash
        run: |
          source /usr/local/perlbrew/etc/bashrc
          cpanm --notest --installdeps .
          perl Makefile.PL
          make
          make install
          latexml --VERSION

      - name: Download arXiv 2509.15541 source
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates 2>/dev/null
          mkdir -p /tmp/paper
          curl -sL "https://arxiv.org/src/2509.15541" -o /tmp/paper/source.tar.gz
          cd /tmp/paper && tar xzf source.tar.gz && ls /tmp/paper/

      - name: Prepare bindings
        shell: bash
        run: |
          BINDINGS="$GITHUB_WORKSPACE/ar5iv-bindings/bindings"
          # Strip all four ar5iv.sty limits (false positives on large documents)
          perl -i -pe "s/, 'tokenlimit=[0-9]*'//g; s/, 'iflimit=[0-9]*'//g; s/, 'absorblimit=[0-9]*'//g; s/, 'pushbacklimit=[0-9]*'//g;" "$BINDINGS/ar5iv.sty.ltxml" || true
          # Stub tcolorbox theorem library using perl (no python3 needed)
          # tcbtheorems.code.tex uses expl3 that LaTeXML cannot execute.
          # The stub must be tcbtheorems.code.tex.ltxml — latexml intercepts
          # \input{tcbtheorems.code.tex} and uses the .ltxml if it exists.
          # Also stub NewCommandCopy.sty.ltxml (luatex/latex3 command).
          perl -e '
            use strict; use warnings;
            my $base = $ENV{GITHUB_WORKSPACE} . "/ar5iv-bindings/bindings/";
            # Main stub: intercepts \input{tcbtheorems.code.tex}
            my $stub = qq{package LaTeXML::Package::Pool;\nuse strict; use warnings; use LaTeXML::Package;\nDefMacro(q{\\newtcbtheorem[]{}{}{}{}}, sub { () });\nDefMacro(q{\\RenewTcbTheorem[]{}{}{}{}}, sub { () });\nDefMacro(q{\\NewCommandCopy{}{}}, sub { () });\nDefMacro(q{\\thetcbcounter}, q{});\nNewCounter(q{tcbcounter});\n1;\n};
            for my $name (qw(tcbtheorems.code.tex tcbtheorems.code)) {
              open(my $fh, ">", $base . $name . ".ltxml") or die;
              print $fh $stub;
              close $fh;
              print "Wrote $name.ltxml\n";
            }'

      - name: Convert paper
        shell: bash
        continue-on-error: true
        run: |
          source /usr/local/perlbrew/etc/bashrc
          cd /tmp/paper
          BINDINGS="$GITHUB_WORKSPACE/ar5iv-bindings/bindings"
          latexml \
            --path="$BINDINGS" \
            --preload=ar5iv.sty \
            --dest=/tmp/paper-out.xml \
            main.tex 2>&1 | tee /tmp/conversion.log
          echo "latexml exit: $?"

      - name: Check result
        if: always()
        shell: bash
        run: |
          if grep -qE "if_limit|token_limit|pushback_limit|absorb_limit" /tmp/conversion.log 2>/dev/null; then
            echo "FAIL: Hit a safety limit"; grep -E "_limit" /tmp/conversion.log; exit 1
          fi
          tail -10 /tmp/conversion.log
          if grep -q "^Conversion complete" /tmp/conversion.log 2>/dev/null; then
            echo "PASS: Paper converted to HTML successfully"
          elif grep -q "Fatal:" /tmp/conversion.log 2>/dev/null; then
            echo "FAIL: Fatal error in conversion"
            grep "Fatal:" /tmp/conversion.log | tail -3; exit 1
          else
            echo "INFO: Conversion ran, status unclear"
          fi

      - name: Upload conversion log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-log-${{ github.run_id }}
          path: /tmp/conversion.log
